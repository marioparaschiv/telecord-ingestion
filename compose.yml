# Pick the services to run with COMPOSE_PROFILES in .env, e.g. COMPOSE_PROFILES=telegram,discord,updater
x-hardening: &hardening
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: unless-stopped

services:
    telegram:
        <<: *hardening
        profiles: [telegram]
        image: ghcr.io/marioparaschiv/telecord-ingestion-telegram:latest
        # The owner of config.toml, which telecord-ingestion leaves readable by its owner only.
        user: ${HOST_UID:-1000}:${HOST_GID:-1000}
        volumes:
            - telegram-data:/data
            # The updater sets HOST_PROJECT_DIR, since `.` would resolve inside its own container.
            - ${HOST_PROJECT_DIR:-.}/config.toml:/config/config.toml:ro
        labels:
            telecord-ingestion.autoupdate: 'true'

    discord:
        <<: *hardening
        profiles: [discord]
        image: ghcr.io/marioparaschiv/telecord-ingestion-discord:latest
        user: ${HOST_UID:-1000}:${HOST_GID:-1000}
        volumes:
            - discord-data:/data
            - ${HOST_PROJECT_DIR:-.}/config.toml:/config/config.toml:ro
        labels:
            telecord-ingestion.autoupdate: 'true'

    updater:
        <<: *hardening
        profiles: [updater]
        image: ghcr.io/marioparaschiv/telecord-ingestion-updater:latest
        init: true
        # Reads .env, which telecord-ingestion leaves readable by its owner only.
        cap_add: [DAC_READ_SEARCH]
        environment:
            COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
            CHECK_INTERVAL: ${CHECK_INTERVAL:-24h}
            UPDATE_DELAY: ${UPDATE_DELAY:-0}
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            # Recreating a service goes through this compose file, so the updated container keeps its configuration.
            # The updater sets HOST_PROJECT_DIR, since `.` would resolve to /project when it recreates itself.
            - ${HOST_PROJECT_DIR:-.}:/project:ro
        labels:
            telecord-ingestion.autoupdate: 'true'

volumes:
    telegram-data:
    discord-data:
