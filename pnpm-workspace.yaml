packages:
  - packages/*
  - producers/*

allowBuilds:
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  utf-8-validate: true

catalog:
  '@msgpack/msgpack': ^3.1.3
  '@mtcute/node': 0.32.3
  '@opentelemetry/api': ^1.9.1
  '@opentelemetry/sdk-metrics': ^2.7.1
  '@telecord/ingest-client': ^0.6.0
  '@total-typescript/ts-reset': ^0.6.1
  '@types/node': ^24.0.0
  '@types/ws': ^8.18.1
  evlog: ^2.20.0
  typescript: ^6.0.3
  vitest: ^4.1.11
  ws: ^8.21.0
  zod: ^4.6.5

minimumReleaseAgeExclude:
  - '@telecord/ingest-client'
